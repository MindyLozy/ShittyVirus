name: Build Locker
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        run: cl /EHsc /Fe:locker.exe shitvirus.cpp user32.lib advapi32.lib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locker
          path: locker.exe
